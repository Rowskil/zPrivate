# ==============================================================================
# zPrivate VPN Server • Docker & Docker-Compose Production Stack
# Containerized WireGuard Gateway with full IP forwarding & iptables NAT
# ==============================================================================

version: "3.8"

services:
  zprivate-gateway:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: zprivate_wireguard_gateway
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - SERVERURL=auto # Auto detects public IP
      - SERVERPORT=51820
      - PEERS=android_client,ios_client
      - PEERDNS=1.1.1.1,8.8.8.8
      - INTERNAL_SUBNET=10.8.0.0
      - ALLOWEDIPS=0.0.0.0/0, ::/0
      - LOG_CONFS=true
    volumes:
      - ./config:/config
      - /lib/modules:/lib/modules
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
