name: Build Android APK Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Release Android APK
    # Pin to ubuntu-24.04 to avoid experimental ubuntu-26 migration issues (runner-images #14748)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare Local Environment & Keystores
        run: |
          cp .env.example .env || true
          touch local.properties
          
          # 1. Generate release keystore (my-upload-key.jks) if not provided by CI secrets
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=zPrivate Release,O=zPrivate,C=US"
          fi
          
          # 2. Generate debug keystore
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # 3. Ensure placeholder google-services.json is present
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789","project_id":"zprivate-vpn"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:abcdef","android_client_info":{"package_name":"com.aistudio.zprivatevpn.xkvqzp"}},"api_key":[{"current_key":"placeholder"}]}]}' > app/google-services.json
          fi

      - name: Build Android Release APK
        env:
          STORE_PASSWORD: "android"
          KEY_PASSWORD: "android"
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Package Official Release APK
        run: |
          mkdir -p release-apk
          RAW_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$RAW_APK" ]; then
            cp "$RAW_APK" release-apk/zPrivate-VPN-v1.0.1.apk
            echo "Official APK ready: release-apk/zPrivate-VPN-v1.0.1.apk"
          else
            echo "Error: No release APK found!"
            exit 1
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zPrivate-VPN-v1.0.1-APK
          path: release-apk/zPrivate-VPN-v1.0.1.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "zPrivate VPN v1.0.1"
          files: release-apk/zPrivate-VPN-v1.0.1.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
