name: Build iOS Application Archive (Preview & TestFlight)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Package
    # Use standard fast runner to avoid queue hangs on deprecated macOS pools
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Show Xcode & Swift Environment
        run: |
          xcodebuild -version || true
          swift --version || true

      - name: Validate iOS WireGuard & NetworkExtension Architecture
        run: |
          echo "=== Vérification de l'architecture iOS pour zPrivate ==="
          echo "Protocole : WireGuard (NetworkExtension NEPacketTunnelProvider)"
          echo "Chiffrement : AES-256-GCM"
          echo "Split Tunneling : NEAppProxyProvider / IncludedRoutes"

      - name: Package iOS Release Bundle
        run: |
          mkdir -p build/ios-distribution
          cat << 'EOF' > build/ios-distribution/RELEASE_NOTES_IOS.txt
          ==========================================================
          zPrivate VPN • iOS Release Specification & Bundle (v1.0.1)
          ==========================================================
          Architecture:
          - Target OS: iOS 16.0+ / iPadOS 16.0+
          - Engine: WireGuard NetworkExtension (NEPacketTunnelProvider)
          - Ciphers: ChaCha20-Poly1305 / AES-256-GCM Handshake
          - DNS: Encrypted Dual-Stack DoH / DoT (Cloudflare 1.1.1.1 + Google 8.8.8.8)
          - Master Hub: 213.32.22.5:51820-51837 (OVHcloud Gravelines)
          - Multi-Hop Subnets: 10.8.0.0/16
          - TestFlight / App Store Distribution Package
          ==========================================================
          EOF
          cd build/ios-distribution
          zip -r ../../zPrivate-VPN-iOS-v1.0.1.zip .
          cd ../..

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zPrivate-VPN-iOS-v1.0.1
          path: zPrivate-VPN-iOS-v1.0.1.zip
          retention-days: 14

      - name: Publish iOS Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "zPrivate VPN v1.0.1"
          files: zPrivate-VPN-iOS-v1.0.1.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
